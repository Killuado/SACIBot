services:
  postgres:
    image: postgres:17-alpine
    container_name: sacibot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sacibot}
      POSTGRES_USER: ${POSTGRES_USER:-sacibot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sacibot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sacibot} -d $${POSTGRES_DB:-sacibot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ${DOCKERHUB_USER:-local}/sacibot-api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: sacibot-api
    env_file:
      - .env
    environment:
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,api
      - DB_ENGINE=${DB_ENGINE:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-sacibot}
      - POSTGRES_USER=${POSTGRES_USER:-sacibot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sacibot}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    ports:
      - "8000:8000"
    volumes:
      - sacibot_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  live-monitor:
    image: ${DOCKERHUB_USER:-local}/sacibot-live-monitor:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.live-monitor
    container_name: sacibot-live-monitor
    env_file:
      - .env
    environment:
      - RUN_MIGRATIONS=false
      - DB_ENGINE=${DB_ENGINE:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-sacibot}
      - POSTGRES_USER=${POSTGRES_USER:-sacibot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sacibot}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    volumes:
      - sacibot_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  discord-bot:
    image: ${DOCKERHUB_USER:-local}/sacibot-discord-bot:${IMAGE_TAG:-latest}
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    container_name: sacibot-discord-bot
    env_file:
      - .env
    environment:
      - BACKEND_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  sacibot_data:
